name: Publish skill release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate repository and upload package
        run: python scripts/validate.py
      - name: Run security and setup regression tests
        run: python -m unittest discover -s tests -v
      - name: Build upload-ready skill ZIP
        run: python scripts/package_skill.py
      - name: Generate release checksum
        run: cd dist && sha256sum paymob-integration.zip > paymob-integration.zip.sha256
      - name: Verify release tag matches plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          version = json.loads(
              Path(".codex-plugin/plugin.json").read_text(encoding="utf-8")
          )["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(
                  f"Release tag {os.environ['RELEASE_TAG']!r} must be {expected!r}"
              )
      - name: Publish permanent skill download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_dir="$(mktemp -d)"
            trap 'rm -rf "$release_dir"' EXIT
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'paymob-integration.zip' \
              --pattern 'paymob-integration.zip.sha256' \
              --dir "$release_dir"
            cmp dist/paymob-integration.zip "$release_dir/paymob-integration.zip"
            cmp dist/paymob-integration.zip.sha256 "$release_dir/paymob-integration.zip.sha256"
            echo "Existing release assets match; refusing to overwrite immutable artifacts."
          else
            gh release create "$RELEASE_TAG" \
              dist/paymob-integration.zip \
              dist/paymob-integration.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --title "Paymob Integration Skill $RELEASE_TAG"
          fi
