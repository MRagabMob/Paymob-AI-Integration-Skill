name: Validate plugin and skill

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate repository and upload package
        run: python scripts/validate.py
      - name: Run security and setup regression tests
        run: python -m unittest discover -s tests -v
      - name: Build upload-ready skill ZIP
        run: python scripts/package_skill.py
      - name: Generate upload checksum
        run: cd dist && sha256sum paymob-integration.zip > paymob-integration.zip.sha256
      - name: Publish skill upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paymob-integration-skill-upload
          path: |
            dist/paymob-integration.zip
            dist/paymob-integration.zip.sha256
          if-no-files-found: error
          retention-days: 14
